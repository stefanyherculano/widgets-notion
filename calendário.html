<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário e Relógio — Rotina Lucrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:transparent;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
.widget{width:100%;min-height:100vh;background:#F5EDE9;border-radius:8px;padding:16px;display:flex;align-items:flex-start;justify-content:center;}
.inner{width:100%;max-width:360px;min-width:0;display:flex;flex-direction:column;gap:16px;}
.card{background:#FFFFFF;border-radius:16px;padding:20px;min-width:0;overflow:hidden;}
.loc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.loc{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;line-height:1.4;color:#5F5F54;text-transform:uppercase;letter-spacing:1px;}
.loc svg{flex-shrink:0;}
.ampm{font-size:12px;font-weight:500;line-height:1.4;color:#5F5F54;text-transform:uppercase;letter-spacing:1px;}
.time-row{display:flex;align-items:baseline;gap:2px;}
.time{font-size:32px;font-weight:700;line-height:1.3;letter-spacing:-0.6px;color:#2E1200;font-variant-numeric:tabular-nums;}
.secs{font-size:14px;font-weight:400;line-height:1.5;color:#5F5F54;margin-left:4px;font-variant-numeric:tabular-nums;}
.date-line{font-size:17px;font-weight:500;line-height:1.4;color:#2E1200;margin-top:3px;}
.date-line span{color:#5F5F54;font-weight:400;}
.wx-loading,.wx-hint{font-size:14px;font-weight:400;line-height:1.5;color:#5F5F54;}
.wx-hint{font-size:12px;font-weight:500;line-height:1.4;margin-top:6px;display:none;}
.wx-body{display:none;}
.wx-main{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.wx-main > div:first-child{min-width:0;}
.wx-temp{font-size:32px;font-weight:700;line-height:1.3;letter-spacing:-0.6px;color:#2E1200;font-variant-numeric:tabular-nums;}
.wx-cond{font-size:17px;font-weight:500;line-height:1.4;color:#2E1200;margin-top:2px;overflow-wrap:break-word;}
.wx-meta{display:none;align-items:center;flex-wrap:wrap;gap:8px;margin-top:3px;font-size:14px;font-weight:400;line-height:1.5;color:#5F5F54;}
.wx-meta .fl{display:flex;align-items:center;gap:3px;}
.wx-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.wx-icon{line-height:0;}
.wx-refresh{background:none;border:none;padding:0;cursor:pointer;color:#5F5F54;line-height:1;}
.wx-refresh.loading{color:#D4916E;}
.wx-refresh.loading svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.wx-stats{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px;}
.stat-val{font-size:14px;font-weight:500;line-height:1.5;color:#2E1200;}
.stat-label{font-size:12px;font-weight:500;line-height:1.4;color:#5F5F54;text-transform:uppercase;letter-spacing:1px;}
.wx-hourly{display:none;gap:4px;margin-top:16px;overflow-x:auto;}
.hour{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;background:transparent;}
.hour.now{background:#F2DFCF;}
.hour-label{font-size:12px;font-weight:600;line-height:1.4;text-transform:uppercase;letter-spacing:1px;color:#5F5F54;}
.hour.now .hour-label{color:#B85C38;}
.hour-dot{width:5px;height:5px;border-radius:50%;background:#F2DFCF;}
.hour.now .hour-dot{background:#B85C38;}
.hour-temp{font-size:12px;font-weight:600;line-height:1.4;color:#5F5F54;font-variant-numeric:tabular-nums;}
.hour.now .hour-temp{color:#2E1200;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav button{background:none;border:none;cursor:pointer;color:#5F5F54;padding:3px;line-height:1;}
.cal-nav button:hover{color:#B85C38;}
.cal-month{font-size:17px;font-weight:500;line-height:1.4;color:#2E1200;text-align:center;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.weekdays div{text-align:center;font-size:12px;font-weight:500;line-height:1.4;color:#5F5F54;text-transform:uppercase;letter-spacing:1px;padding-bottom:4px;}
.days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;}
.day-cell{display:flex;align-items:center;justify-content:center;height:32px;}
.num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;font-weight:400;line-height:1.5;color:#2E1200;cursor:pointer;transition:background 0.12s;user-select:none;font-variant-numeric:tabular-nums;}
.num:hover{background:#F2DFCF;}
.weekend .num{color:#5F5F54;}
.today .num{background:#B85C38;color:#FFFFFF;font-weight:600;}
.today .num:hover{background:#B85C38;}
@media (max-width: 260px){
.num{width:24px;height:24px;font-size:12px;}
.day-cell{height:28px;}
}
@media (prefers-color-scheme: dark){
.widget{background:#3A2D25;}
.card{background:#45362D;}
.time,.date-line,.wx-temp,.wx-cond,.stat-val,.num{color:rgba(255,255,255,0.95);}
.loc,.ampm,.secs,.date-line span,.wx-loading,.wx-hint,.wx-meta,.wx-refresh,.stat-label,.hour-label,.hour-temp,.cal-nav button,.weekdays div,.weekend .num{color:rgba(255,255,255,0.5);}
.cal-month{color:rgba(255,255,255,0.95);}
.hour.now{background:#724D3C;}
.hour-dot{background:#724D3C;}
.num:hover{background:#724D3C;}
.hour.now .hour-label,.hour.now .hour-dot{color:#B85C38;}
.hour.now .hour-dot{background:#B85C38;}
.hour.now .hour-temp{color:rgba(255,255,255,0.95);}
.today .num{background:#B85C38;color:#FFFFFF;}
.today .num:hover{background:#B85C38;}
.cal-nav button:hover{color:#B85C38;}
}
</style>
</head>
<body>
<div class="widget">
	<div class="inner">
		<section class="card">
			<div class="loc-row">
				<div class="loc"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#B85C38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span id="cityName">—</span></div>
				<span class="ampm" id="ampm">AM</span>
			</div>
			<div class="time-row"><span class="time" id="timeMain">00:00</span><span class="secs" id="timeSecs">:00</span></div>
			<div class="date-line" id="dateLine">—</div>
		</section>
		<section class="card">
			<div class="wx-loading" id="wxLoading">Buscando localização…</div>
			<div class="wx-body" id="wxBody">
				<div class="wx-main">
					<div>
						<div class="wx-temp" id="wxTemp">—</div>
						<div class="wx-cond" id="wxCond">—</div>
						<div class="wx-meta" id="wxMeta"></div>
					</div>
					<div class="wx-right">
						<div class="wx-icon" id="wxIcon"></div>
						<button class="wx-refresh" id="wxRefresh" type="button" aria-label="Atualizar clima" title="Atualizar clima"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
					</div>
				</div>
				<div class="wx-hint" id="wxHint"></div>
				<div class="wx-stats" id="wxStats"></div>
				<div class="wx-hourly" id="wxHourly"></div>
			</div>
		</section>
		<section class="card">
			<div class="cal-nav">
				<button id="prevBtn" type="button" aria-label="Mês anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
				<span class="cal-month" id="calMonth">—</span>
				<button id="nextBtn" type="button" aria-label="Próximo mês"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
			</div>
			<div class="weekdays" id="weekdays"></div>
			<div class="days" id="daysGrid"></div>
		</section>
	</div>
</div>
<script>
if ('serviceWorker' in navigator) {
	navigator.serviceWorker.register('./sw.js').catch(function(){});
}
(function () {
	var DAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
	var MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
	var SOFT = '#D4916E';
	var ACCENT = '#B85C38';
	var PALE = '#F2DFCF';
	var CACHE_KEY = 'rl-clima-v1';
	var elCity = document.getElementById('cityName');
	var elAmPm = document.getElementById('ampm');
	var elTime = document.getElementById('timeMain');
	var elSecs = document.getElementById('timeSecs');
	var elDate = document.getElementById('dateLine');
	var elWxLoading = document.getElementById('wxLoading');
	var elWxBody = document.getElementById('wxBody');
	var elWxTemp = document.getElementById('wxTemp');
	var elWxCond = document.getElementById('wxCond');
	var elWxMeta = document.getElementById('wxMeta');
	var elWxIcon = document.getElementById('wxIcon');
	var elWxHint = document.getElementById('wxHint');
	var elWxStats = document.getElementById('wxStats');
	var elWxHourly = document.getElementById('wxHourly');
	var btnRefresh = document.getElementById('wxRefresh');
	var elCalMonth = document.getElementById('calMonth');
	var elWeekdays = document.getElementById('weekdays');
	var elDaysGrid = document.getElementById('daysGrid');
	var btnPrev = document.getElementById('prevBtn');
	var btnNext = document.getElementById('nextBtn');
	var today = new Date();
	var viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
	var wx = null;
	var status = 'loading';
	function pad(n) { return String(n).padStart(2, '0'); }
	function updateClock() {
		var now = new Date();
		elTime.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
		elSecs.textContent = ':' + pad(now.getSeconds());
		elAmPm.textContent = now.getHours() < 12 ? 'AM' : 'PM';
		elDate.innerHTML = DAYS[now.getDay()] + ', <span>' + now.getDate() + ' de ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear() + '</span>';
	}
	function wmoLabel(code) {
		if (code === 0) return 'Céu limpo';
		if (code <= 2) return 'Predominantemente limpo';
		if (code === 3) return 'Nublado';
		if (code <= 48) return 'Névoa';
		if (code <= 55) return 'Chuvisco';
		if (code <= 65) return 'Chuva';
		if (code <= 77) return 'Neve';
		if (code <= 82) return 'Pancadas de chuva';
		if (code <= 99) return 'Tempestade';
		return 'Variável';
	}
	function sunIcon(s) {
		var c = s / 2;
		var parts = [];
		for (var i = 0; i < 8; i++) {
			var a = (i * 45 * Math.PI) / 180;
			parts.push('<line x1="' + (c + c * 0.55 * Math.cos(a)).toFixed(2) + '" y1="' + (c + c * 0.55 * Math.sin(a)).toFixed(2) + '" x2="' + (c + c * 0.75 * Math.cos(a)).toFixed(2) + '" y2="' + (c + c * 0.75 * Math.sin(a)).toFixed(2) + '" stroke="' + SOFT + '" stroke-width="2" stroke-linecap="round"/>');
		}
		parts.push('<circle cx="' + c + '" cy="' + c + '" r="' + (c * 0.38).toFixed(2) + '" fill="' + ACCENT + '"/>');
		return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" fill="none">' + parts.join('') + '</svg>';
	}
	function sunCloudIcon(s) {
		var parts = [];
		for (var i = 0; i < 6; i++) {
			var a = ((i * 60 - 30) * Math.PI) / 180;
			parts.push('<line x1="' + (20 + 16 * Math.cos(a)).toFixed(2) + '" y1="' + (20 + 16 * Math.sin(a)).toFixed(2) + '" x2="' + (20 + 21 * Math.cos(a)).toFixed(2) + '" y2="' + (20 + 21 * Math.sin(a)).toFixed(2) + '" stroke="' + SOFT + '" stroke-width="2" stroke-linecap="round"/>');
		}
		parts.push('<circle cx="20" cy="20" r="9" fill="' + ACCENT + '"/>');
		parts.push('<path d="M16 46 C9 46 4 41 4 35 C4 29.5 8 25.5 13 25 C14 19 19 15 25 15 C31 15 36 19.5 36.5 25.5 C40 26 44 29 44 34 C44 40 39.5 46 34 46Z" fill="' + PALE + '"/>');
		return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 56 56" fill="none">' + parts.join('') + '</svg>';
	}
	function cloudIcon(s) {
		return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 56 56" fill="none"><path d="M10 38 C4 38 0 33 0 27 C0 21.5 4 17.5 9 17 C10 11 15 7 21 7 C27 7 32 11.5 32.5 17.5 C36 18 40 21 40 26 C40 32 35.5 38 30 38Z" fill="' + PALE + '"/><line x1="4" y1="44" x2="36" y2="44" stroke="' + PALE + '" stroke-width="3" stroke-linecap="round"/><line x1="8" y1="50" x2="32" y2="50" stroke="' + PALE + '" stroke-width="2" stroke-linecap="round" opacity="0.5"/></svg>';
	}
	function rainIcon(s) {
		var drops = [[8, 40], [16, 43], [24, 40], [12, 48], [20, 51]];
		var parts = ['<path d="M10 34 C4 34 0 29 0 23 C0 17.5 4 13.5 9 13 C10 7 15 3 21 3 C27 3 32 7.5 32.5 13.5 C36 14 40 17 40 22 C40 28 35.5 34 30 34Z" fill="' + PALE + '"/>'];
		for (var i = 0; i < drops.length; i++) {
			parts.push('<line x1="' + drops[i][0] + '" y1="' + drops[i][1] + '" x2="' + (drops[i][0] - 2) + '" y2="' + (drops[i][1] + 5) + '" stroke="' + SOFT + '" stroke-width="2" stroke-linecap="round"/>');
		}
		return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 56 56" fill="none">' + parts.join('') + '</svg>';
	}
	function showerIcon(s) {
		var drops = [[6, 36], [14, 39], [22, 36], [30, 39], [10, 45], [18, 48], [26, 45]];
		var parts = ['<path d="M10 30 C4 30 0 25 0 19 C0 13.5 4 9.5 9 9 C10 3 15 -1 21 -1 C27 -1 32 3.5 32.5 9.5 C36 10 40 13 40 18 C40 24 35.5 30 30 30Z" fill="' + PALE + '"/>'];
		for (var i = 0; i < drops.length; i++) {
			parts.push('<line x1="' + drops[i][0] + '" y1="' + drops[i][1] + '" x2="' + (drops[i][0] - 3) + '" y2="' + (drops[i][1] + 6) + '" stroke="' + SOFT + '" stroke-width="2" stroke-linecap="round"/>');
		}
		return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 56 56" fill="none">' + parts.join('') + '</svg>';
	}
	function stormIcon(s) {
		return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 56 56" fill="none"><path d="M10 30 C4 30 0 25 0 19 C0 13.5 4 9.5 9 9 C10 3 15 -1 21 -1 C27 -1 32 3.5 32.5 9.5 C36 10 40 13 40 18 C40 24 35.5 30 30 30Z" fill="' + PALE + '"/><polyline points="20,34 14,44 22,44 16,56" fill="none" stroke="' + ACCENT + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
	}
	function weatherIcon(code, s) {
		if (code === 0 || code === 1) return sunIcon(s);
		if (code <= 3) return sunCloudIcon(s);
		if (code <= 48) return cloudIcon(s);
		if (code <= 67) return rainIcon(s);
		if (code <= 82) return showerIcon(s);
		return stormIcon(s);
	}
	function loadCache() {
		try {
			var raw = localStorage.getItem(CACHE_KEY);
			return raw ? JSON.parse(raw) : null;
		} catch (e) { return null; }
	}
	function saveCache(data) {
		try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
	}
	function renderWeather() {
		if (status === 'loading' && !wx) {
			elWxLoading.style.display = 'block';
			elWxBody.style.display = 'none';
			return;
		}
		elWxLoading.style.display = 'none';
		elWxBody.style.display = 'block';
		if (wx) {
			elWxTemp.textContent = wx.temp + '°C';
			elWxCond.textContent = wx.condition;
			elWxIcon.innerHTML = weatherIcon(wx.code, 52);
			elCity.textContent = wx.city || '—';
			elWxMeta.style.display = 'flex';
			elWxMeta.innerHTML = '<span class="fl"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#D4916E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>Sensação ' + wx.feelsLike + '°C</span><span>·</span><span>↓' + wx.low + '° ↑' + wx.high + '°</span>';
			elWxStats.style.display = 'grid';
			elWxStats.innerHTML = '<div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#D4916E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg><span class="stat-val">' + wx.humidity + '%</span><span class="stat-label">Umidade</span></div><div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5F5F54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg><span class="stat-val">' + wx.wind + ' km/h</span><span class="stat-label">Vento</span></div><div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B85C38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg><span class="stat-val">' + (wx.visibility != null ? wx.visibility + ' km' : '— km') + '</span><span class="stat-label">Visib.</span></div>';
			if (wx.hourly && wx.hourly.length > 0) {
				elWxHourly.style.display = 'flex';
				var hh = [];
				for (var i = 0; i < wx.hourly.length; i++) {
					hh.push('<div class="hour' + (i === 0 ? ' now' : '') + '"><span class="hour-label">' + wx.hourly[i].label + '</span><div class="hour-dot"></div><span class="hour-temp">' + wx.hourly[i].temp + '°</span></div>');
				}
				elWxHourly.innerHTML = hh.join('');
			} else {
				elWxHourly.style.display = 'none';
			}
		} else {
			elWxTemp.textContent = '—';
			elWxCond.textContent = '—';
			elWxIcon.innerHTML = '';
			elWxMeta.style.display = 'none';
			elWxStats.style.display = 'none';
			elWxHourly.style.display = 'none';
		}
		if (status === 'cached') {
			elWxHint.style.display = 'block';
			elWxHint.textContent = 'Último dado salvo';
		} else if (status === 'error' && !wx) {
			elWxHint.style.display = 'block';
			elWxHint.textContent = 'Sem dados de clima';
		} else {
			elWxHint.style.display = 'none';
		}
	}
	function fetchWithTimeout(url, ms) {
		var controller = new AbortController();
		var timer = setTimeout(function () { controller.abort(); }, ms || 8000);
		return fetch(url, { signal: controller.signal }).finally(function () { clearTimeout(timer); });
	}
	function getGeo() {
		return fetchWithTimeout('https://ipwho.is/').then(function (res) {
			if (!res.ok) throw new Error('geo');
			return res.json();
		}).then(function (geo) {
			if (geo.success === false || geo.latitude == null || geo.longitude == null) throw new Error('geo');
			return { latitude: geo.latitude, longitude: geo.longitude, city: geo.city || geo.region || 'Localização atual' };
		}).catch(function () {
			return fetchWithTimeout('https://ipapi.co/json/').then(function (res) {
				if (!res.ok) throw new Error('geo');
				return res.json();
			}).then(function (geo) {
				if (geo.latitude == null || geo.longitude == null) throw new Error('geo');
				return { latitude: geo.latitude, longitude: geo.longitude, city: geo.city || geo.region || 'Localização atual' };
			});
		});
	}
	function loadWeather() {
		status = 'loading';
		btnRefresh.classList.add('loading');
		renderWeather();
		getGeo().then(function (geo) {
			return fetchWithTimeout('https://api.open-meteo.com/v1/forecast?latitude=' + geo.latitude + '&longitude=' + geo.longitude + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weathercode,visibility&hourly=temperature_2m&wind_speed_unit=kmh&timezone=auto&forecast_days=1').then(function (res) {
				if (!res.ok) throw new Error('wx');
				return res.json();
			}).then(function (w) {
				var curHour = new Date().getHours();
				var temps = w.hourly.temperature_2m;
				var hourly = [];
				for (var i = 0; i < 6; i++) {
					var idx = curHour + i;
					if (idx < 24) hourly.push({ label: i === 0 ? 'Agora' : idx + 'h', temp: Math.round(temps[idx]) });
				}
				var daySlice = temps.slice(0, 24);
				wx = {
					city: geo.city,
					temp: Math.round(w.current.temperature_2m),
					feelsLike: Math.round(w.current.apparent_temperature),
					condition: wmoLabel(w.current.weathercode),
					code: w.current.weathercode,
					humidity: w.current.relative_humidity_2m,
					wind: Math.round(w.current.wind_speed_10m),
					visibility: w.current.visibility != null ? Math.round(w.current.visibility / 1000) : null,
					high: Math.round(Math.max.apply(null, daySlice)),
					low: Math.round(Math.min.apply(null, daySlice)),
					hourly: hourly
				};
				saveCache(wx);
				status = 'ok';
				btnRefresh.classList.remove('loading');
				renderWeather();
			});
		}).catch(function () {
			status = wx ? 'cached' : 'error';
			btnRefresh.classList.remove('loading');
			renderWeather();
		});
	}
	function renderWeekdays() {
		var parts = [];
		for (var i = 0; i < 7; i++) parts.push('<div>' + DAYS[i][0] + '</div>');
		elWeekdays.innerHTML = parts.join('');
	}
	function renderCalendar() {
		var vy = viewDate.getFullYear();
		var vm = viewDate.getMonth();
		elCalMonth.textContent = MONTHS[vm] + ' ' + vy;
		var firstDow = new Date(vy, vm, 1).getDay();
		var totalDays = new Date(vy, vm + 1, 0).getDate();
		var now = new Date();
		var cells = [];
		for (var i = 0; i < 42; i++) {
			var day = i - firstDow + 1;
			if (day < 1 || day > totalDays) {
				cells.push('<div class="day-cell"></div>');
			} else {
				var isToday = day === now.getDate() && vm === now.getMonth() && vy === now.getFullYear();
				var dow = i % 7;
				var cls = 'day-cell' + (dow === 0 || dow === 6 ? ' weekend' : '') + (isToday ? ' today' : '');
				cells.push('<div class="' + cls + '"><div class="num">' + day + '</div></div>');
			}
		}
		elDaysGrid.innerHTML = cells.join('');
	}
	btnPrev.addEventListener('click', function () {
		viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
		renderCalendar();
	});
	btnNext.addEventListener('click', function () {
		viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
		renderCalendar();
	});
	btnRefresh.addEventListener('click', loadWeather);
	wx = loadCache();
	updateClock();
	setInterval(updateClock, 1000);
	renderWeekdays();
	renderCalendar();
	renderWeather();
	loadWeather();
	setInterval(loadWeather, 20 * 60 * 1000);
})();
</script>
</body>
</html>
