<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário e Relógio — Rotina Lucrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Inter:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F5EDE9;
--ink:#00272B;
--muted:#606763;
--accent:#DC794E;
--fill:#F0DFD6;
--terracota:#D48D6C;
--divider:#DDD5D0;
--label:'Albert Sans',sans-serif;
--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
--value:'Lato',sans-serif;
}
*{box-sizing:border-box;}
html,body{
margin:0;
padding:0;
height:100%;
background:transparent;
font-family:var(--sans);
-webkit-font-smoothing:antialiased;
}
body{
display:flex;
align-items:center;
justify-content:center;
padding:14px;
min-height:100%;
}
@media (prefers-reduced-motion:reduce){
*{transition:none !important;}
}
.widget{
width:100%;
max-width:440px;
background:var(--bg);
border-radius:8px;
padding:30px 30px 26px;
color:var(--ink);
}
.top-row{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:18px;
}
.eyebrow{
font-family:var(--label);
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
color:var(--muted);
margin:0 0 6px;
font-weight:600;
}
.date-full{
font-family:var(--label);
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
font-weight:600;
margin:0 0 14px;
color:var(--ink);
}
.clock{
font-family:var(--value);
font-weight:700;
font-size:26px;
font-variant-numeric:tabular-nums;
line-height:1;
color:var(--terracota);
}
.weather{
display:none;
flex-direction:column;
align-items:flex-end;
text-align:right;
padding-top:2px;
min-width:70px;
}
.weather.has-data{display:flex;}
.weather-icon{font-size:24px;line-height:1;margin-bottom:4px;}
.weather-temp{font-family:var(--value);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);}
.weather-city{
font-family:var(--label);
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
font-weight:600;
color:var(--muted);
margin-top:5px;
max-width:100px;
}
.divider{height:1px;background:var(--divider);margin:24px 0 18px;border:none;}
.cal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:16px;
gap:10px;
}
.cal-nav{display:flex;align-items:center;gap:10px;}
.nav-btn{
width:28px;height:28px;
border-radius:50%;
border:none;
background:var(--fill);
color:var(--ink);
display:flex;align-items:center;justify-content:center;
cursor:pointer;
transition:background .15s ease, color .15s ease;
padding:0;
flex-shrink:0;
}
.nav-btn:hover{color:var(--accent);}
.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.cal-month{
font-family:var(--sans);
font-weight:700;
font-size:16px;
min-width:112px;
text-align:center;
text-transform:capitalize;
color:var(--ink);
}
.today-btn{
border:none;
color:var(--ink);
background:var(--fill);
border-radius:999px;
padding:7px 15px;
font-family:var(--label);
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
font-weight:600;
cursor:pointer;
transition:background .15s ease, color .15s ease;
white-space:nowrap;
}
.today-btn:hover{background:var(--accent);color:#FFFFFF;}
.today-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.weekdays-row{
display:grid;
grid-template-columns:repeat(7,1fr);
margin-bottom:6px;
}
.weekdays-row span{
font-family:var(--label);
text-align:center;
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
color:var(--muted);
font-weight:600;
}
.days-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
row-gap:2px;
}
.day-cell{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
}
.day-cell .num{
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
font-size:13px;
font-weight:500;
font-variant-numeric:tabular-nums;
color:var(--ink);
}
.day-cell.muted .num{color:var(--muted);opacity:.4;}
.day-cell.weekend:not(.muted):not(.today) .num{color:var(--muted);}
.day-cell.today .num{
color:#FFFFFF;
font-weight:700;
background:var(--accent);
}
@media (max-width:360px){
.widget{padding:22px 20px 20px;}
.cal-month{font-size:14px;min-width:92px;}
.day-cell .num{width:25px;height:25px;font-size:12px;}
.today-btn{padding:6px 12px;}
}
</style>
</head>
<body>
<div class="widget">
<div class="top-row">
<div class="datetime">
<p class="eyebrow" id="weekday">—</p>
<p class="date-full" id="fullDate">—</p>
<div class="clock" id="clockTime">00:00:00</div>
</div>
<div class="weather" id="weatherCard">
<div class="weather-icon" id="weatherIcon"></div>
<div class="weather-temp" id="weatherTemp"></div>
<div class="weather-city" id="weatherCity"></div>
</div>
</div>

<hr class="divider">

<div class="cal-head">
<div class="cal-nav">
<button class="nav-btn" id="prevBtn" aria-label="Mês anterior" type="button">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<span class="cal-month" id="calMonth">—</span>
<button class="nav-btn" id="nextBtn" aria-label="Próximo mês" type="button">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
</div>
<button class="today-btn" id="todayBtn" type="button">Hoje</button>
</div>

<div class="weekdays-row">
<span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
</div>
<div class="days-grid" id="daysGrid"></div>
</div>

<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./sw.js').catch(function(){});
}
(function(){
var WEEKDAYS_FULL = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

var today = new Date();
var viewDate = new Date(today.getFullYear(), today.getMonth(), 1);

var elWeekday = document.getElementById('weekday');
var elFullDate = document.getElementById('fullDate');
var elClock = document.getElementById('clockTime');
var elCalMonth = document.getElementById('calMonth');
var elDaysGrid = document.getElementById('daysGrid');

function pad(n){ return String(n).padStart(2,'0'); }

function updateClock(){
var now = new Date();
elWeekday.textContent = WEEKDAYS_FULL[now.getDay()];
elFullDate.textContent = now.getDate() + ' de ' + MONTHS[now.getMonth()].toLowerCase() + ' de ' + now.getFullYear();
elClock.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}

function daysInMonth(year, monthIndex){
return new Date(year, monthIndex + 1, 0).getDate();
}

function addCell(dayNum, muted, isToday, dow){
var cell = document.createElement('div');
cell.className = 'day-cell' + (muted ? ' muted' : '') + ((dow === 0 || dow === 6) ? ' weekend' : '') + (isToday ? ' today' : '');
var num = document.createElement('span');
num.className = 'num';
num.textContent = dayNum;
cell.appendChild(num);
elDaysGrid.appendChild(cell);
}

function renderCalendar(){
var year = viewDate.getFullYear();
var month = viewDate.getMonth();
elCalMonth.textContent = MONTHS[month].toLowerCase() + ' ' + year;

var firstDow = new Date(year, month, 1).getDay();
var totalDays = daysInMonth(year, month);
var prevTotalDays = daysInMonth(year, month - 1);
var todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

elDaysGrid.innerHTML = '';
var dow = 0;

for (var i = firstDow - 1; i >= 0; i--){
addCell(prevTotalDays - i, true, false, dow % 7);
dow++;
}
for (var d = 1; d <= totalDays; d++){
var isToday = (year === todayY && month === todayM && d === todayD);
addCell(d, false, isToday, dow % 7);
dow++;
}
var trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
for (var t = 1; t <= trailing; t++){
addCell(t, true, false, dow % 7);
dow++;
}
}

document.getElementById('prevBtn').addEventListener('click', function(){
viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
renderCalendar();
});
document.getElementById('nextBtn').addEventListener('click', function(){
viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
renderCalendar();
});
document.getElementById('todayBtn').addEventListener('click', function(){
viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
renderCalendar();
});

updateClock();
setInterval(updateClock, 1000);
renderCalendar();

var weatherCard = document.getElementById('weatherCard');
var weatherIcon = document.getElementById('weatherIcon');
var weatherTemp = document.getElementById('weatherTemp');
var weatherCity = document.getElementById('weatherCity');

function fetchWithTimeout(url, ms){
var controller = new AbortController();
var id = setTimeout(function(){ controller.abort(); }, ms || 6000);
return fetch(url, { signal: controller.signal }).finally(function(){ clearTimeout(id); });
}

function iconFor(code){
if (code === 0) return '☀️';
if (code === 1 || code === 2) return '🌤️';
if (code === 3) return '☁️';
if (code === 45 || code === 48) return '🌫️';
if ([51,53,55,56,57].indexOf(code) !== -1) return '🌦️';
if ([61,63,65,66,67,80,81,82].indexOf(code) !== -1) return '🌧️';
if ([71,73,75,77,85,86].indexOf(code) !== -1) return '❄️';
if ([95,96,99].indexOf(code) !== -1) return '⛈️';
return '🌡️';
}

function loadWeather(){
if (!navigator.onLine) return;
fetchWithTimeout('https://ipapi.co/json/', 6000)
.then(function(res){ if(!res.ok) throw new Error('geo'); return res.json(); })
.then(function(geo){
if (!geo || geo.latitude == null || geo.longitude == null) throw new Error('sem localizacao');
var city = geo.city || geo.region || '';
var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + geo.latitude + '&longitude=' + geo.longitude + '&current=temperature_2m,weather_code&timezone=auto';
return fetchWithTimeout(url, 6000)
.then(function(res){ if(!res.ok) throw new Error('clima'); return res.json(); })
.then(function(w){ return { city: city, data: w }; });
})
.then(function(result){
var current = result.data && result.data.current;
if (!current || current.temperature_2m == null) throw new Error('sem dados');
weatherIcon.textContent = iconFor(current.weather_code);
weatherTemp.textContent = Math.round(current.temperature_2m) + '°';
weatherCity.textContent = result.city;
weatherCard.classList.add('has-data');
})
.catch(function(){
weatherCard.classList.remove('has-data');
});
}

loadWeather();
setInterval(loadWeather, 20 * 60 * 1000);
})();
</script>
</body>
</html>
