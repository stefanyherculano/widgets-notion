<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Calendário · Rotina Lucrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Inter:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  color-scheme: light dark;
  scrollbar-width: thin;
  scrollbar-color: #D3D1CB transparent;
}

html, body {
  background-color: transparent;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-font-smoothing: antialiased;
  height: fit-content;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  width: 9.5px;
  height: 9.5px;
}

html::-webkit-scrollbar-track,
body::-webkit-scrollbar-track {
  background: transparent;
}

html::-webkit-scrollbar-thumb,
body::-webkit-scrollbar-thumb {
  background-color: #D3D1CB;
  border-radius: 100px;
  border: 2px solid transparent;
  background-clip: padding-box;
  min-height: 40px;
}

html::-webkit-scrollbar-thumb:hover,
body::-webkit-scrollbar-thumb:hover {
  background-color: #B8B5AE;
  background-clip: padding-box;
}

.rl-cal {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 5px 6px;
  gap: 14px;
}

.rl-cal-card {
  width: 100%;
  background-color: #F5EDE9;
  border: 1px solid #DDD5D0;
  border-radius: 8px;
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.rl-clock-card {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.rl-clock {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rl-clock-time {
  font-family: 'Lato', sans-serif;
  font-weight: 700;
  font-size: 26px;
  font-variant-numeric: tabular-nums;
  color: #D48D6C;
  line-height: 1;
}

.rl-clock-date {
  font-family: 'Albert Sans', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #D48D6C;
}

.rl-weather {
  display: flex;
  align-items: center;
  gap: 10px;
}

.rl-weather--hidden { display: none; }

.rl-weather-temp {
  font-family: 'Lato', sans-serif;
  font-weight: 700;
  font-size: 26px;
  font-variant-numeric: tabular-nums;
  color: #2C2C2B;
  line-height: 1;
}

.rl-weather-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: right;
}

.rl-weather-desc {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 500;
  font-size: 13px;
  color: #2C2C2B;
}

.rl-weather-city {
  font-family: 'Albert Sans', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #D48D6C;
}

.rl-cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.rl-cal-title {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
  color: #2C2C2B;
  cursor: pointer;
  text-align: left;
}

.rl-cal-nav {
  display: flex;
  gap: 8px;
}

.rl-step-btn {
  width: 30px;
  height: 30px;
  background-color: rgba(212, 141, 108, 0.15);
  border: 1px solid rgba(212, 141, 108, 0.3);
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  transition: background-color 0.15s ease;
}

.rl-step-btn:hover {
  background-color: rgba(212, 141, 108, 0.3);
}

.rl-step-btn svg { width: 24px; height: 24px; }

.rl-today-btn {
  height: 30px;
  padding: 0 10px;
  background-color: rgba(212, 141, 108, 0.15);
  border: 1px solid rgba(212, 141, 108, 0.3);
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-family: 'Albert Sans', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #D48D6C;
  transition: background-color 0.15s ease;
}

.rl-today-btn:hover {
  background-color: rgba(212, 141, 108, 0.3);
}

.rl-today-btn--hidden { display: none; }

.rl-cal-week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.rl-cal-week span {
  font-family: 'Albert Sans', sans-serif;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #D48D6C;
  text-align: center;
}

.rl-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  row-gap: 8px;
}

.rl-cal-day {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 500;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: #2C2C2B;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.rl-cal-day--muted {
  color: rgba(55, 53, 47, 0.35);
}

.rl-cal-day--today {
  background-color: #D48D6C;
  color: #FFFFFF;
  border-radius: 100px;
  width: 32px;
  justify-self: center;
}

@media (prefers-color-scheme: dark) {
  .rl-cal-card {
    background-color: #45362D;
    border-color: #7D5A49;
  }
  .rl-cal-title { color: rgba(255, 255, 255, 0.95); }
  .rl-weather-temp { color: rgba(255, 255, 255, 0.95); }
  .rl-weather-desc { color: rgba(255, 255, 255, 0.95); }
  .rl-cal-day { color: rgba(255, 255, 255, 0.95); }
  .rl-cal-day--muted { color: rgba(255, 255, 255, 0.3); }
  .rl-cal-day--today { color: #FFFFFF; }
}
</style>
</head>
<body>
<div class="rl-cal">
  <div class="rl-cal-card rl-clock-card">
    <div class="rl-clock">
      <div class="rl-clock-time" id="rl-clock-time">--:--</div>
      <div class="rl-clock-date" id="rl-clock-date"></div>
    </div>
    <div class="rl-weather rl-weather--hidden" id="rl-weather">
      <div class="rl-weather-temp" id="rl-weather-temp"></div>
      <div class="rl-weather-info">
        <div class="rl-weather-desc" id="rl-weather-desc"></div>
        <div class="rl-weather-city" id="rl-weather-city"></div>
      </div>
    </div>
  </div>
  <div class="rl-cal-card">
    <div class="rl-cal-header">
      <div class="rl-cal-title" id="rl-cal-title"></div>
      <div class="rl-cal-nav">
        <button class="rl-today-btn rl-today-btn--hidden" id="rl-cal-today">HOJE</button>
        <button class="rl-step-btn" id="rl-cal-prev"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#D48D6C"><path d="M14 7l-5 5 5 5z"/></svg></button>
        <button class="rl-step-btn" id="rl-cal-next"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#D48D6C"><path d="M10 17l5-5-5-5z"/></svg></button>
      </div>
    </div>
    <div class="rl-cal-week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
    <div class="rl-cal-grid" id="rl-cal-grid"></div>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
(function() {
  var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  var CLIMA = { 0: 'Céu limpo', 1: 'Poucas nuvens', 2: 'Parcialmente nublado', 3: 'Nublado', 45: 'Nevoeiro', 48: 'Nevoeiro', 51: 'Garoa', 53: 'Garoa', 55: 'Garoa', 56: 'Garoa gelada', 57: 'Garoa gelada', 61: 'Chuva fraca', 63: 'Chuva', 65: 'Chuva forte', 66: 'Chuva gelada', 67: 'Chuva gelada', 71: 'Neve fraca', 73: 'Neve', 75: 'Neve forte', 77: 'Neve', 80: 'Pancadas de chuva', 81: 'Pancadas de chuva', 82: 'Pancadas fortes', 85: 'Pancadas de neve', 86: 'Pancadas de neve', 95: 'Tempestade', 96: 'Tempestade com granizo', 99: 'Tempestade com granizo' };
  var titleEl = document.getElementById('rl-cal-title');
  var gridEl = document.getElementById('rl-cal-grid');
  var prevBtn = document.getElementById('rl-cal-prev');
  var nextBtn = document.getElementById('rl-cal-next');
  var todayBtn = document.getElementById('rl-cal-today');
  var navEl = document.querySelector('.rl-cal-nav');
  var headerEl = document.querySelector('.rl-cal-header');
  var timeEl = document.getElementById('rl-clock-time');
  var dateEl = document.getElementById('rl-clock-date');
  var weatherEl = document.getElementById('rl-weather');
  var tempEl = document.getElementById('rl-weather-temp');
  var descEl = document.getElementById('rl-weather-desc');
  var cityEl = document.getElementById('rl-weather-city');
  var agora = new Date();
  var viewYear = agora.getFullYear();
  var viewMonth = agora.getMonth();
  var todayKey = agora.toDateString();

  function render() {
    titleEl.textContent = MESES[viewMonth] + ' ' + viewYear;
    var atual = new Date();
    if (viewYear === atual.getFullYear() && viewMonth === atual.getMonth()) {
      todayBtn.classList.add('rl-today-btn--hidden');
    } else {
      todayBtn.classList.remove('rl-today-btn--hidden');
    }
    gridEl.innerHTML = '';
    var first = new Date(viewYear, viewMonth, 1).getDay();
    var dias = new Date(viewYear, viewMonth + 1, 0).getDate();
    var diasPrev = new Date(viewYear, viewMonth, 0).getDate();
    var total = 42;
    for (var i = 0; i < total; i++) {
      var cell = document.createElement('div');
      var cls = 'rl-cal-day';
      var num;
      var muted = false;
      if (i < first) {
        num = diasPrev - first + 1 + i;
        muted = true;
      } else if (i >= first + dias) {
        num = i - first - dias + 1;
        muted = true;
      } else {
        num = i - first + 1;
      }
      if (muted) {
        cls += ' rl-cal-day--muted';
      } else if (new Date(viewYear, viewMonth, num).toDateString() === todayKey) {
        cls += ' rl-cal-day--today';
      }
      cell.className = cls;
      cell.textContent = num;
      gridEl.appendChild(cell);
    }
    alignHeader();
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function updateClock() {
    var n = new Date();
    timeEl.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
    dateEl.textContent = DIAS[n.getDay()] + ', ' + n.getDate() + ' de ' + MESES[n.getMonth()].toLowerCase();
  }

  function carregarClima() {
    fetch('https://ipwho.is/').then(function(r) { return r.json(); }).then(function(geo) {
      if (!geo || !geo.success) return;
      var cidade = geo.city || '';
      fetch('https://api.open-meteo.com/v1/forecast?latitude=' + geo.latitude + '&longitude=' + geo.longitude + '&current=temperature_2m,weather_code').then(function(r) { return r.json(); }).then(function(dados) {
        if (!dados || !dados.current) return;
        tempEl.textContent = Math.round(dados.current.temperature_2m) + '°';
        descEl.textContent = CLIMA[dados.current.weather_code] || '';
        cityEl.textContent = cidade;
        weatherEl.classList.remove('rl-weather--hidden');
      }).catch(function() {});
    }).catch(function() {});
  }

  function alignHeader() {
    var cells = gridEl.children;
    if (!cells.length) return;
    var hRect = headerEl.getBoundingClientRect();
    var range = document.createRange();
    var left = null;
    var right = null;
    for (var i = 0; i < cells.length; i++) {
      var col = i % 7;
      if (col !== 0 && col !== 6) continue;
      range.selectNodeContents(cells[i]);
      var r = range.getBoundingClientRect();
      if (col === 0 && (left === null || r.left < left)) left = r.left;
      if (col === 6 && (right === null || r.right > right)) right = r.right;
    }
    if (left === null || right === null) return;
    titleEl.style.marginLeft = Math.max(0, Math.round(left - hRect.left)) + 'px';
    navEl.style.marginRight = Math.max(0, Math.round(hRect.right - right)) + 'px';
  }

  prevBtn.addEventListener('click', function() {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });

  nextBtn.addEventListener('click', function() {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  todayBtn.addEventListener('click', function() {
    var n = new Date();
    viewYear = n.getFullYear();
    viewMonth = n.getMonth();
    render();
  });

  titleEl.addEventListener('click', function() {
    var n = new Date();
    viewYear = n.getFullYear();
    viewMonth = n.getMonth();
    render();
  });

  setInterval(function() {
    var n = new Date();
    if (n.toDateString() !== todayKey) {
      todayKey = n.toDateString();
      render();
    }
  }, 60000);

  render();
  updateClock();
  setInterval(updateClock, 1000);
  carregarClima();
  setInterval(carregarClima, 1800000);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(alignHeader);
  }
  window.addEventListener('resize', alignHeader);
})();
</script>
</body>
</html>
