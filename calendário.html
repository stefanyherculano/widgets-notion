<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Calendário e Relógio — Rotina Lucrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Inter:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html{color-scheme:light dark;}
html,body{
margin:0;
padding:0;
height:100%;
background:transparent;
font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}
body{
display:flex;
align-items:center;
justify-content:center;
padding:14px;
min-height:100%;
}
@media (prefers-reduced-motion:reduce){
*{transition:none !important;}
}
.widget{
width:100%;
max-width:440px;
background:#F5EDE9;
border-radius:8px;
padding:30px 30px 26px;
color:#00272B;
}
.top-row{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:18px;
}
.eyebrow{
font-family:'Albert Sans',sans-serif;
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
color:#606763;
margin:0 0 6px;
font-weight:600;
}
.date-full{
font-family:'Albert Sans',sans-serif;
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
font-weight:600;
margin:0 0 14px;
color:#00272B;
}
.clock{
font-family:'Lato',sans-serif;
font-weight:700;
font-size:26px;
font-variant-numeric:tabular-nums;
line-height:1;
color:#D48D6C;
}
.weather{
display:none;
flex-direction:column;
align-items:flex-end;
text-align:right;
padding-top:2px;
}
.weather.has-data{display:flex;}
.weather-icon{margin-bottom:6px;}
.weather-icon svg{width:28px;height:28px;display:block;}
.weather-temp{font-family:'Lato',sans-serif;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1;color:#00272B;}
.weather-city{
font-family:'Albert Sans',sans-serif;
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
font-weight:600;
color:#606763;
margin-top:5px;
white-space:nowrap;
}
.divider{height:1px;background:#DDD5D0;margin:24px 0 18px;border:none;}
.cal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:16px;
gap:10px;
}
.cal-nav{display:flex;align-items:center;gap:10px;}
.nav-btn{
width:28px;height:28px;
border-radius:50%;
border:none;
background:#F0DFD6;
color:#00272B;
display:flex;align-items:center;justify-content:center;
cursor:pointer;
transition:background .15s ease, color .15s ease;
padding:0;
flex-shrink:0;
}
.nav-btn:hover{color:#DC794E;}
.nav-btn:focus-visible{outline:2px solid #DC794E;outline-offset:2px;}
.cal-month{
font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
font-weight:700;
font-size:16px;
min-width:112px;
text-align:center;
text-transform:capitalize;
color:#00272B;
}
.today-btn{
border:none;
color:#00272B;
background:#F0DFD6;
border-radius:999px;
padding:7px 15px;
font-family:'Albert Sans',sans-serif;
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
font-weight:600;
cursor:pointer;
transition:background .15s ease, color .15s ease;
white-space:nowrap;
}
.today-btn:hover{background:#DC794E;color:#FFFFFF;}
.today-btn:focus-visible{outline:2px solid #DC794E;outline-offset:2px;}
.weekdays-row{
display:grid;
grid-template-columns:repeat(7,30px);
justify-content:space-between;
margin-bottom:16px;
}
.weekdays-row span{
font-family:'Albert Sans',sans-serif;
text-align:center;
font-size:10px;
letter-spacing:1.5px;
text-transform:uppercase;
color:#606763;
font-weight:600;
}
.days-grid{
display:grid;
grid-template-columns:repeat(7,30px);
justify-content:space-between;
row-gap:24px;
}
.day-cell{
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
}
.day-cell .num{
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
font-size:13px;
font-weight:500;
font-variant-numeric:tabular-nums;
color:#00272B;
}
.day-cell.muted .num{color:#606763;opacity:.4;}
.day-cell.weekend:not(.muted):not(.today) .num{color:#606763;}
.day-cell.today .num{
color:#FFFFFF;
font-weight:700;
background:#DC794E;
}
@media (prefers-color-scheme: dark){
.widget{background:#45362D;color:rgba(255,255,255,0.95);}
.eyebrow{color:rgba(255,255,255,0.5);}
.date-full{color:rgba(255,255,255,0.95);}
.weather-temp{color:rgba(255,255,255,0.95);}
.weather-city{color:rgba(255,255,255,0.5);}
.divider{background:#7D5A49;}
.nav-btn{background:#724D3C;color:rgba(255,255,255,0.95);}
.nav-btn:hover{color:#DC794E;}
.cal-month{color:rgba(255,255,255,0.95);}
.today-btn{background:#724D3C;color:rgba(255,255,255,0.95);}
.today-btn:hover{background:#DC794E;color:#FFFFFF;}
.weekdays-row span{color:rgba(255,255,255,0.5);}
.day-cell .num{color:rgba(255,255,255,0.95);}
.day-cell.muted .num{color:rgba(255,255,255,0.5);opacity:.4;}
.day-cell.weekend:not(.muted):not(.today) .num{color:rgba(255,255,255,0.5);}
.day-cell.today .num{color:#FFFFFF;background:#DC794E;}
}
@media (max-width:360px){
.widget{padding:22px 20px 20px;}
.cal-month{font-size:14px;min-width:92px;}
.weekdays-row{grid-template-columns:repeat(7,26px);}
.days-grid{grid-template-columns:repeat(7,26px);row-gap:20px;}
.day-cell{width:26px;height:26px;}
.day-cell .num{width:26px;height:26px;font-size:12px;}
.today-btn{padding:6px 12px;}
.weather-city{white-space:normal;max-width:110px;}
.weather-icon svg{width:24px;height:24px;}
}
</style>
</head>
<body>
<div class="widget">
<div class="top-row">
<div class="datetime">
<p class="eyebrow" id="weekday">—</p>
<p class="date-full" id="fullDate">—</p>
<div class="clock" id="clockTime">00:00:00</div>
</div>
<div class="weather" id="weatherCard">
<div class="weather-icon" id="weatherIcon"></div>
<div class="weather-temp" id="weatherTemp"></div>
<div class="weather-city" id="weatherCity"></div>
</div>
</div>

<hr class="divider">

<div class="cal-head">
<div class="cal-nav">
<button class="nav-btn" id="prevBtn" aria-label="Mês anterior" type="button">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<span class="cal-month" id="calMonth">—</span>
<button class="nav-btn" id="nextBtn" aria-label="Próximo mês" type="button">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>
</div>
<button class="today-btn" id="todayBtn" type="button">Hoje</button>
</div>

<div class="weekdays-row">
<span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
</div>
<div class="days-grid" id="daysGrid"></div>
</div>

<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./sw.js').catch(function(){});
}
(function(){
var WEEKDAYS_FULL = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

var today = new Date();
var viewDate = new Date(today.getFullYear(), today.getMonth(), 1);

var elWeekday = document.getElementById('weekday');
var elFullDate = document.getElementById('fullDate');
var elClock = document.getElementById('clockTime');
var elCalMonth = document.getElementById('calMonth');
var elDaysGrid = document.getElementById('daysGrid');

function pad(n){ return String(n).padStart(2,'0'); }

function updateClock(){
var now = new Date();
elWeekday.textContent = WEEKDAYS_FULL[now.getDay()];
elFullDate.textContent = now.getDate() + ' de ' + MONTHS[now.getMonth()].toLowerCase() + ' de ' + now.getFullYear();
elClock.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}

function daysInMonth(year, monthIndex){
return new Date(year, monthIndex + 1, 0).getDate();
}

function addCell(dayNum, muted, isToday, dow){
var cell = document.createElement('div');
cell.className = 'day-cell' + (muted ? ' muted' : '') + ((dow === 0 || dow === 6) ? ' weekend' : '') + (isToday ? ' today' : '');
var num = document.createElement('span');
num.className = 'num';
num.textContent = dayNum;
cell.appendChild(num);
elDaysGrid.appendChild(cell);
}

function renderCalendar(){
var year = viewDate.getFullYear();
var month = viewDate.getMonth();
elCalMonth.textContent = MONTHS[month].toLowerCase() + ' ' + year;

var firstDow = new Date(year, month, 1).getDay();
var totalDays = daysInMonth(year, month);
var prevTotalDays = daysInMonth(year, month - 1);
var todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

elDaysGrid.innerHTML = '';
var dow = 0;

for (var i = firstDow - 1; i >= 0; i--){
addCell(prevTotalDays - i, true, false, dow % 7);
dow++;
}
for (var d = 1; d <= totalDays; d++){
var isToday = (year === todayY && month === todayM && d === todayD);
addCell(d, false, isToday, dow % 7);
dow++;
}
var trailing = (7 - ((firstDow + totalDays) % 7)) % 7;
for (var t = 1; t <= trailing; t++){
addCell(t, true, false, dow % 7);
dow++;
}
}

document.getElementById('prevBtn').addEventListener('click', function(){
viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
renderCalendar();
});
document.getElementById('nextBtn').addEventListener('click', function(){
viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
renderCalendar();
});
document.getElementById('todayBtn').addEventListener('click', function(){
viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
renderCalendar();
});

updateClock();
setInterval(updateClock, 1000);
renderCalendar();

var weatherCard = document.getElementById('weatherCard');
var weatherIcon = document.getElementById('weatherIcon');
var weatherTemp = document.getElementById('weatherTemp');
var weatherCity = document.getElementById('weatherCity');

function svgIcon(paths){
return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#D48D6C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
}

var ICONS = {
sun: svgIcon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'),
sunCloud: svgIcon('<path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>'),
cloud: svgIcon('<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>'),
fog: svgIcon('<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 17H7"/><path d="M17 21H9"/>'),
drizzle: svgIcon('<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 19v1"/><path d="M12 21v1"/><path d="M16 19v1"/>'),
rain: svgIcon('<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15v5"/><path d="M12 17v5"/><path d="M16 15v5"/>'),
snow: svgIcon('<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 16h.01"/><path d="M8 20h.01"/><path d="M12 18h.01"/><path d="M12 22h.01"/><path d="M16 16h.01"/><path d="M16 20h.01"/>'),
storm: svgIcon('<path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/>'),
thermo: svgIcon('<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>')
};

function iconFor(code){
if (code === 0) return ICONS.sun;
if (code === 1 || code === 2) return ICONS.sunCloud;
if (code === 3) return ICONS.cloud;
if (code === 45 || code === 48) return ICONS.fog;
if ([51,53,55,56,57].indexOf(code) !== -1) return ICONS.drizzle;
if ([61,63,65,66,67,80,81,82].indexOf(code) !== -1) return ICONS.rain;
if ([71,73,75,77,85,86].indexOf(code) !== -1) return ICONS.snow;
if ([95,96,99].indexOf(code) !== -1) return ICONS.storm;
return ICONS.thermo;
}

function fetchWithTimeout(url, ms){
var controller = new AbortController();
var id = setTimeout(function(){ controller.abort(); }, ms || 6000);
return fetch(url, { signal: controller.signal }).finally(function(){ clearTimeout(id); });
}

function getGeo(){
return fetchWithTimeout('https://ipwho.is/', 6000)
.then(function(res){ if(!res.ok) throw new Error('geo'); return res.json(); })
.then(function(geo){
if (!geo || geo.success === false || geo.latitude == null || geo.longitude == null) throw new Error('geo');
return { latitude: geo.latitude, longitude: geo.longitude, city: geo.city || geo.region || '' };
})
.catch(function(){
return fetchWithTimeout('https://ipapi.co/json/', 6000)
.then(function(res){ if(!res.ok) throw new Error('geo'); return res.json(); })
.then(function(geo){
if (!geo || geo.latitude == null || geo.longitude == null) throw new Error('geo');
return { latitude: geo.latitude, longitude: geo.longitude, city: geo.city || geo.region || '' };
});
});
}

function loadWeather(){
getGeo()
.then(function(geo){
var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + geo.latitude + '&longitude=' + geo.longitude + '&current=temperature_2m,weather_code&timezone=auto';
return fetchWithTimeout(url, 6000)
.then(function(res){ if(!res.ok) throw new Error('clima'); return res.json(); })
.then(function(w){ return { city: geo.city, data: w }; });
})
.then(function(result){
var current = result.data && result.data.current;
if (!current || current.temperature_2m == null) throw new Error('sem dados');
weatherIcon.innerHTML = iconFor(current.weather_code);
weatherTemp.textContent = Math.round(current.temperature_2m) + '°';
weatherCity.textContent = result.city;
weatherCard.classList.add('has-data');
})
.catch(function(){
if (!weatherCard.classList.contains('has-data')) {
setTimeout(loadWeather, 60000);
}
});
}

loadWeather();
setInterval(loadWeather, 20 * 60 * 1000);
})();
</script>
</body>
</html>
