<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronômetro · Rotina Lucrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
color-scheme: light dark;
scrollbar-width: thin;
scrollbar-color: #D3D1CB transparent;
}

html, body {
background-color: transparent;
overflow-x: hidden;
overflow-y: auto;
-webkit-font-smoothing: antialiased;
height: fit-content;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
width: 9.5px;
height: 9.5px;
}

html::-webkit-scrollbar-track,
body::-webkit-scrollbar-track {
background: transparent;
}

html::-webkit-scrollbar-thumb,
body::-webkit-scrollbar-thumb {
background-color: #D3D1CB;
border-radius: 100px;
border: 2px solid transparent;
background-clip: padding-box;
min-height: 40px;
}

html::-webkit-scrollbar-thumb:hover,
body::-webkit-scrollbar-thumb:hover {
background-color: #B8B5AE;
background-clip: padding-box;
}

.rl-cron {
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
padding: 5px 6px;
gap: 14px;
}

.rl-cron-display {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
font-weight: 700;
font-size: 30px;
color: rgba(55, 53, 47, 1);
letter-spacing: -0.02em;
line-height: 1.2;
font-variant-numeric: tabular-nums;
}

@media (prefers-color-scheme: dark) {
.rl-cron-display { color: rgba(255, 255, 255, 0.95); }
}

.rl-cron-controls {
display: flex;
gap: 8px;
align-items: center;
justify-content: center;
width: 100%;
}

.rl-btn {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
font-weight: 500;
font-size: 14px;
line-height: 1;
color: #2C2C2B;
background-color: #F5EDE9;
border: 1px solid #DDD5D0;
border-radius: 6px;
padding: 8px 12px;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
box-shadow: none;
transition: background-color 0.15s ease, border-color 0.15s ease;
appearance: none;
-webkit-appearance: none;
width: 100%;
height: 32px;
}

.rl-btn[hidden] { display: none; }

.rl-btn:hover,
.rl-btn:active,
.rl-btn:focus {
background-color: #EBDAD2;
border-color: #D5C5BB;
color: #2C2C2B;
outline: none;
}

.rl-label {
color: #2C2C2B;
white-space: nowrap;
}

@media (prefers-color-scheme: dark) {
.rl-btn {
background-color: #45362D;
border-color: #7D5A49;
color: rgba(255, 255, 255, 0.95);
}
.rl-btn:hover,
.rl-btn:active,
.rl-btn:focus {
background-color: #724D3C;
border-color: #7D5A49;
color: rgba(255, 255, 255, 0.95);
}
.rl-label { color: rgba(255, 255, 255, 0.95); }
}

.rl-icon {
display: inline-flex;
align-items: center;
justify-content: center;
width: 18px;
height: 18px;
flex-shrink: 0;
}

.rl-icon svg {
width: 100%;
height: 100%;
display: block;
}
</style>
</head>
<body>
<div class="rl-cron">
<div class="rl-cron-display" id="rl-cron-display">00:00</div>
<div class="rl-cron-controls">
<button class="rl-btn" id="rl-toggle" type="button"><span class="rl-icon" id="rl-toggle-icon"></span><span class="rl-label" id="rl-toggle-label">Iniciar</span></button>
<button class="rl-btn" id="rl-reset" type="button"><span class="rl-icon" id="rl-reset-icon"></span><span class="rl-label">Zerar</span></button>
</div>
</div>
<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./sw.js').catch(function(){});
}

(function() {

var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

var ICON_RESET = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>';

var params = new URLSearchParams(window.location.search);
var cliente = (params.get('cliente') || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
var STORAGE_KEY = cliente ? 'rl-cron-state-' + cliente : 'rl-cron-state';

var display = document.getElementById('rl-cron-display');
var toggleBtn = document.getElementById('rl-toggle');
var toggleIcon = document.getElementById('rl-toggle-icon');
var toggleLabel = document.getElementById('rl-toggle-label');
var resetBtn = document.getElementById('rl-reset');
var resetIcon = document.getElementById('rl-reset-icon');

toggleIcon.innerHTML = ICON_PLAY;
resetIcon.innerHTML = ICON_RESET;

var elapsed = 0;
var startTime = 0;
var interval = null;
var running = false;

function loadState() {
try {
var raw = localStorage.getItem(STORAGE_KEY);
if (raw) {
var c = JSON.parse(raw);
if (typeof c.elapsed === 'number' && c.elapsed >= 0) elapsed = c.elapsed;
if (c.running === true && typeof c.startTime === 'number' && c.startTime > 0 && c.startTime <= Date.now()) {
startTime = c.startTime;
running = true;
}
}
} catch (e) {}
}

function saveState() {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify({
elapsed: elapsed,
running: running,
startTime: startTime
}));
} catch (e) {}
}

function format(ms) {
if (ms < 0) ms = 0;
var totalSec = Math.floor(ms / 1000);
var h = Math.floor(totalSec / 3600);
var m = Math.floor((totalSec % 3600) / 60);
var s = totalSec % 60;
if (h > 0) {
return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function render() {
var current = running ? elapsed + (Date.now() - startTime) : elapsed;
display.textContent = format(current);
}

function tick() { render(); }

function start() {
running = true;
startTime = Date.now();
interval = setInterval(tick, 250);
toggleIcon.innerHTML = ICON_PAUSE;
toggleLabel.textContent = 'Pausar';
saveState();
render();
}

function pause() {
running = false;
elapsed += Date.now() - startTime;
startTime = 0;
clearInterval(interval);
interval = null;
toggleIcon.innerHTML = ICON_PLAY;
toggleLabel.textContent = 'Continuar';
saveState();
render();
}

function reset() {
running = false;
elapsed = 0;
startTime = 0;
clearInterval(interval);
interval = null;
toggleIcon.innerHTML = ICON_PLAY;
toggleLabel.textContent = 'Iniciar';
saveState();
render();
}

toggleBtn.addEventListener('click', function() {
if (running) pause();
else start();
});

resetBtn.addEventListener('click', reset);

loadState();
if (running) {
interval = setInterval(tick, 250);
toggleIcon.innerHTML = ICON_PAUSE;
toggleLabel.textContent = 'Pausar';
} else if (elapsed > 0) {
toggleLabel.textContent = 'Continuar';
}
render();

})();
</script>
</body>
</html>
