<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro · Rotina Lucrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Lato:wght@700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
color-scheme: light dark;
scrollbar-width: thin;
scrollbar-color: #D3D1CB transparent;
}

html, body {
background-color: transparent;
overflow-x: hidden;
overflow-y: auto;
-webkit-font-smoothing: antialiased;
height: fit-content;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
width: 9.5px;
height: 9.5px;
}

html::-webkit-scrollbar-track,
body::-webkit-scrollbar-track {
background: transparent;
}

html::-webkit-scrollbar-thumb,
body::-webkit-scrollbar-thumb {
background-color: #D3D1CB;
border-radius: 100px;
border: 2px solid transparent;
background-clip: padding-box;
min-height: 40px;
}

html::-webkit-scrollbar-thumb:hover,
body::-webkit-scrollbar-thumb:hover {
background-color: #B8B5AE;
background-clip: padding-box;
}

.rl-pomo {
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
padding: 5px 6px;
gap: 14px;
}

.rl-pomo-display {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
font-weight: 700;
font-size: 30px;
color: rgba(55, 53, 47, 1);
letter-spacing: -0.02em;
line-height: 1.2;
font-variant-numeric: tabular-nums;
}

.rl-pomo-cycle-info {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
font-weight: 500;
font-size: 13px;
color: rgba(55, 53, 47, 0.6);
margin-top: -4px;
}

@media (prefers-color-scheme: dark) {
.rl-pomo-display { color: rgba(255, 255, 255, 0.95); }
.rl-pomo-cycle-info { color: rgba(255, 255, 255, 0.55); }
}

.rl-pomo-controls {
display: flex;
gap: 8px;
align-items: center;
justify-content: center;
width: 100%;
}

.rl-btn {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
font-weight: 500;
font-size: 14px;
line-height: 1;
color: #2C2C2B;
background-color: #F5EDE9;
border: 1px solid #DDD5D0;
border-radius: 6px;
padding: 8px 12px;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
box-shadow: none;
transition: background-color 0.15s ease, border-color 0.15s ease;
appearance: none;
-webkit-appearance: none;
width: 100%;
height: 32px;
}

.rl-btn[hidden] { display: none; }

.rl-btn:hover,
.rl-btn:active,
.rl-btn:focus {
background-color: #EBDAD2;
border-color: #D5C5BB;
color: #2C2C2B;
outline: none;
}

.rl-label {
color: #2C2C2B;
white-space: nowrap;
}

@media (prefers-color-scheme: dark) {
.rl-btn {
background-color: #45362D;
border-color: #7D5A49;
color: rgba(255, 255, 255, 0.95);
}
.rl-btn:hover,
.rl-btn:active,
.rl-btn:focus {
background-color: #724D3C;
border-color: #7D5A49;
color: rgba(255, 255, 255, 0.95);
}
.rl-label { color: rgba(255, 255, 255, 0.95); }
}

.rl-icon {
display: inline-flex;
align-items: center;
justify-content: center;
width: 18px;
height: 18px;
flex-shrink: 0;
}

.rl-icon svg {
width: 100%;
height: 100%;
display: block;
}

.rl-cards {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 8px;
width: 100%;
}

.rl-card {
background-color: #F5EDE9;
border: 1px solid #DDD5D0;
border-radius: 8px;
padding: 14px 12px;
display: grid;
grid-template-rows: 1fr 1fr 1fr;
align-items: center;
justify-items: center;
min-height: 120px;
min-width: 0;
}

.rl-card--end {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
gap: 8px;
}

.rl-pomo--running .rl-card {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
gap: 8px;
}

.rl-pomo--running .rl-card-control { display: none; }

@media (prefers-color-scheme: dark) {
.rl-card {
background-color: #45362D;
border-color: #7D5A49;
}
}

.rl-card-value {
font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
font-weight: 700;
font-size: 26px;
color: #D48D6C;
letter-spacing: -0.01em;
line-height: 1;
display: flex;
align-items: baseline;
gap: 4px;
}

.rl-card-value-unit {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
font-weight: 500;
font-size: 11px;
color: rgba(55, 53, 47, 0.55);
text-transform: lowercase;
letter-spacing: 0.5px;
}

@media (prefers-color-scheme: dark) {
.rl-card-value-unit { color: rgba(255, 255, 255, 0.5); }
}

.rl-card-label {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
font-weight: 600;
font-size: 10px;
letter-spacing: 1.5px;
text-transform: uppercase;
color: rgba(55, 53, 47, 0.6);
text-align: center;
}

@media (prefers-color-scheme: dark) {
.rl-card-label { color: rgba(255, 255, 255, 0.6); }
}

.rl-card-control {
width: 100%;
display: flex;
align-items: center;
justify-content: center;
}

.rl-slider {
appearance: none;
-webkit-appearance: none;
width: 100%;
height: 4px;
background: rgba(212, 141, 108, 0.25);
border-radius: 2px;
outline: none;
cursor: pointer;
}

.rl-slider::-webkit-slider-thumb {
appearance: none;
-webkit-appearance: none;
width: 14px;
height: 14px;
background: #D48D6C;
border-radius: 50%;
cursor: pointer;
border: none;
}

.rl-slider::-moz-range-thumb {
width: 14px;
height: 14px;
background: #D48D6C;
border-radius: 50%;
cursor: pointer;
border: none;
}

.rl-stepper {
display: flex;
gap: 8px;
}

.rl-step-btn {
width: 30px;
height: 30px;
display: inline-flex;
align-items: center;
justify-content: center;
background-color: rgba(212, 141, 108, 0.15);
border: 1px solid rgba(212, 141, 108, 0.3);
border-radius: 7px;
cursor: pointer;
padding: 0;
transition: background-color 0.15s ease;
appearance: none;
-webkit-appearance: none;
}

.rl-step-btn:hover {
background-color: rgba(212, 141, 108, 0.3);
}

.rl-step-btn svg {
width: 24px;
height: 24px;
display: block;
}
</style>
</head>
<body>
<div class="rl-pomo" id="rl-pomo">
<div class="rl-pomo-display" id="rl-pomo-display">25:00</div>
<div class="rl-pomo-cycle-info" id="rl-pomo-cycle-info">Ciclo 1/4</div>
<div class="rl-pomo-controls">
<button class="rl-btn" id="rl-pomo-start" type="button"><span class="rl-icon" id="rl-start-icon"></span><span class="rl-label">Iniciar sessão de foco</span></button>
<button class="rl-btn" id="rl-pomo-exit" type="button" hidden><span class="rl-icon" id="rl-exit-icon"></span><span class="rl-label">Sair da sessão de foco</span></button>
</div>
<div class="rl-cards">
<div class="rl-card">
<div class="rl-card-value"><span id="rl-val-focus">25</span><span class="rl-card-value-unit">min</span></div>
<div class="rl-card-label">Foco</div>
<div class="rl-card-control"><input class="rl-slider" id="rl-slider-focus" type="range" min="1" max="60" step="1" value="25"></div>
</div>
<div class="rl-card">
<div class="rl-card-value"><span id="rl-val-break">5</span><span class="rl-card-value-unit">min</span></div>
<div class="rl-card-label">Pausa</div>
<div class="rl-card-control"><input class="rl-slider" id="rl-slider-break" type="range" min="1" max="30" step="1" value="5"></div>
</div>
<div class="rl-card">
<div class="rl-card-value"><span id="rl-val-cycles">4</span></div>
<div class="rl-card-label">Ciclos</div>
<div class="rl-card-control"><div class="rl-stepper">
<button class="rl-step-btn" id="rl-cycles-down" type="button" aria-label="Diminuir ciclos"><svg viewBox="0 0 24 24" fill="#D48D6C"><path d="M7 10l5 5 5-5z"/></svg></button>
<button class="rl-step-btn" id="rl-cycles-up" type="button" aria-label="Aumentar ciclos"><svg viewBox="0 0 24 24" fill="#D48D6C"><path d="M7 14l5-5 5 5z"/></svg></button>
</div></div>
</div>
<div class="rl-card rl-card--end">
<div class="rl-card-value"><span id="rl-val-end">--:--</span></div>
<div class="rl-card-label">Termina às</div>
</div>
</div>
</div>
<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./sw.js').catch(function(){});
}

(function() {

var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

var ICON_EXIT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>';

var STORAGE_KEY = 'rl-pomo-config';
var SESSION_KEY = 'rl-pomo-session';

var root = document.getElementById('rl-pomo');
var display = document.getElementById('rl-pomo-display');
var cycleInfo = document.getElementById('rl-pomo-cycle-info');
var startBtn = document.getElementById('rl-pomo-start');
var startIcon = document.getElementById('rl-start-icon');
var exitBtn = document.getElementById('rl-pomo-exit');
var exitIcon = document.getElementById('rl-exit-icon');

var sliderFocus = document.getElementById('rl-slider-focus');
var sliderBreak = document.getElementById('rl-slider-break');
var valFocus = document.getElementById('rl-val-focus');
var valBreak = document.getElementById('rl-val-break');
var valCycles = document.getElementById('rl-val-cycles');
var valEnd = document.getElementById('rl-val-end');
var cyclesUp = document.getElementById('rl-cycles-up');
var cyclesDown = document.getElementById('rl-cycles-down');

startIcon.innerHTML = ICON_PLAY;
exitIcon.innerHTML = ICON_EXIT;

var focusMin = 25;
var breakMin = 5;
var totalCycles = 4;

function loadConfig() {
try {
var raw = localStorage.getItem(STORAGE_KEY);
if (raw) {
var c = JSON.parse(raw);
if (c.focusMin >= 1 && c.focusMin <= 60) focusMin = c.focusMin;
if (c.breakMin >= 1 && c.breakMin <= 30) breakMin = c.breakMin;
if (c.totalCycles >= 2 && c.totalCycles <= 10) totalCycles = c.totalCycles;
}
} catch (e) {}
}

function saveConfig() {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify({
focusMin: focusMin,
breakMin: breakMin,
totalCycles: totalCycles
}));
} catch (e) {}
}

loadConfig();

sliderFocus.value = focusMin;
sliderBreak.value = breakMin;
valFocus.textContent = focusMin;
valBreak.textContent = breakMin;
valCycles.textContent = totalCycles;

var interval = null;
var endTime = 0;
var remaining = 0;
var phaseIndex = 0;
var cycle = 1;
var running = false;

function phaseDuration() {
return (phaseIndex === 0 ? focusMin : breakMin) * 60 * 1000;
}

function format(ms) {
if (ms < 0) ms = 0;
var totalSec = Math.ceil(ms / 1000);
var m = Math.floor(totalSec / 60);
var s = totalSec % 60;
return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function formatClock(date) {
return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
}

function calcRemainingTotalMs() {
var ms = 0;
if (running) {
ms += Math.max(0, endTime - Date.now());
} else {
ms += remaining > 0 ? remaining : phaseDuration();
}
var futurePhase = phaseIndex;
var futureCycle = cycle;
while (true) {
if (futurePhase === 0) {
futurePhase = 1;
ms += breakMin * 60 * 1000;
} else {
if (futureCycle >= totalCycles) break;
futureCycle++;
futurePhase = 0;
ms += focusMin * 60 * 1000;
}
if (futurePhase === 1 && futureCycle === totalCycles) {
break;
}
}
return ms;
}

function updateEndTime() {
var totalMs = calcRemainingTotalMs();
var end = new Date(Date.now() + totalMs);
valEnd.textContent = formatClock(end);
}

function render(showRemaining) {
cycleInfo.textContent = 'Ciclo ' + cycle + '/' + totalCycles;
display.textContent = format(showRemaining);
updateEndTime();
}

function beep() {
try {
var ctx = new (window.AudioContext || window.webkitAudioContext)();
var osc = ctx.createOscillator();
var gain = ctx.createGain();
osc.connect(gain);
gain.connect(ctx.destination);
osc.frequency.value = 660;
gain.gain.setValueAtTime(0.0001, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
osc.start(ctx.currentTime);
osc.stop(ctx.currentTime + 0.42);
} catch (e) {}
}

function saveSession() {
try {
if (running) {
localStorage.setItem(SESSION_KEY, JSON.stringify({
phaseIndex: phaseIndex,
cycle: cycle,
endTime: endTime
}));
} else {
localStorage.removeItem(SESSION_KEY);
}
} catch (e) {}
}

function enterRunningUI() {
startBtn.hidden = true;
exitBtn.hidden = false;
root.classList.add('rl-pomo--running');
}

function exitRunningUI() {
startBtn.hidden = false;
exitBtn.hidden = true;
root.classList.remove('rl-pomo--running');
}

function advance() {
beep();
if (phaseIndex === 0) {
phaseIndex = 1;
} else {
if (cycle >= totalCycles) return false;
cycle++;
phaseIndex = 0;
}
remaining = phaseDuration();
return true;
}

function stopSession() {
clearInterval(interval);
interval = null;
running = false;
phaseIndex = 0;
cycle = 1;
remaining = phaseDuration();
exitRunningUI();
saveSession();
render(remaining);
}

function tick() {
var ms = endTime - Date.now();
if (ms <= 0) {
if (!advance()) {
stopSession();
return;
}
endTime = Date.now() + remaining;
saveSession();
render(remaining);
} else {
render(ms);
}
}

function startSession() {
phaseIndex = 0;
cycle = 1;
remaining = phaseDuration();
endTime = Date.now() + remaining;
interval = setInterval(tick, 250);
running = true;
enterRunningUI();
saveSession();
render(remaining);
}

function resumeSession(saved) {
phaseIndex = saved.phaseIndex;
cycle = saved.cycle;
endTime = saved.endTime;
running = true;
while (endTime - Date.now() <= 0) {
if (phaseIndex === 0) {
phaseIndex = 1;
} else {
if (cycle >= totalCycles) {
running = false;
break;
}
cycle++;
phaseIndex = 0;
}
endTime += phaseDuration();
}
if (!running) {
stopSession();
return;
}
interval = setInterval(tick, 250);
enterRunningUI();
saveSession();
render(endTime - Date.now());
}

startBtn.addEventListener('click', startSession);
exitBtn.addEventListener('click', stopSession);

sliderFocus.addEventListener('input', function() {
focusMin = parseInt(sliderFocus.value, 10);
valFocus.textContent = focusMin;
saveConfig();
if (!running) {
remaining = phaseDuration();
render(remaining);
} else {
updateEndTime();
}
});

sliderBreak.addEventListener('input', function() {
breakMin = parseInt(sliderBreak.value, 10);
valBreak.textContent = breakMin;
saveConfig();
if (!running) {
render(remaining > 0 ? remaining : phaseDuration());
} else {
updateEndTime();
}
});

cyclesUp.addEventListener('click', function() {
if (totalCycles < 10) {
totalCycles++;
valCycles.textContent = totalCycles;
saveConfig();
render(running ? endTime - Date.now() : (remaining > 0 ? remaining : phaseDuration()));
}
});

cyclesDown.addEventListener('click', function() {
if (totalCycles > 2) {
totalCycles--;
if (cycle > totalCycles) cycle = totalCycles;
valCycles.textContent = totalCycles;
saveConfig();
render(running ? endTime - Date.now() : (remaining > 0 ? remaining : phaseDuration()));
}
});

remaining = phaseDuration();
var savedSession = null;
try {
var rawSession = localStorage.getItem(SESSION_KEY);
if (rawSession) savedSession = JSON.parse(rawSession);
} catch (e) {}
if (savedSession && typeof savedSession.endTime === 'number' && (savedSession.phaseIndex === 0 || savedSession.phaseIndex === 1) && typeof savedSession.cycle === 'number' && savedSession.cycle >= 1 && savedSession.cycle <= totalCycles) {
resumeSession(savedSession);
} else {
render(remaining);
}

})();
</script>
</body>
</html>
